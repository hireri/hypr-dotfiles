general {
    lock_cmd = qs ipc -c isra call lockscreen lock
    before_sleep_cmd = qs ipc -c isra call lockscreen lock
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 240
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = qs ipc -c isra call lockscreen lock
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}